name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-type:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint/type dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: |
          ruff check --config pyproject.toml scripts/visualize_top3_seed_average.py tests/

      - name: Black format check
        run: |
          black --check --config pyproject.toml scripts/visualize_top3_seed_average.py tests/

      - name: isort import check
        run: |
          isort --check-only --settings-path pyproject.toml scripts/visualize_top3_seed_average.py tests/

      - name: Mypy type check
        run: |
          mypy --config-file pyproject.toml scripts/visualize_top3_seed_average.py tests/

  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.25.2 matplotlib==3.8.1 scipy jsonschema==4.23.0

      - name: Run smoke tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
