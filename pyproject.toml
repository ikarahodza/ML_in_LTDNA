[tool.black]
line-length = 100
target-version = ["py311", "py312"]
extend-exclude = """
(
  ^/Mix_Results/
  | ^/Single_Results/
  | ^/reports/
  | ^/figures/
  | ^/external_validation_results/
  | ^/cross_validation_results/
  | ^/top_models_report_overall/
  | ^/top_models_report_scientific/
  | ^/top_models_report_seed_average/
  | ^/deployment/
  | ^/__pycache__/
)
"""

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip_glob = [
  "Mix_Results/**",
  "Single_Results/**",
  "reports/**",
  "figures/**",
  "external_validation_results/**",
  "cross_validation_results/**",
  "top_models_report_overall/**",
  "top_models_report_scientific/**",
  "top_models_report_seed_average/**",
  "deployment/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "Mix_Results",
  "Single_Results",
  "reports",
  "figures",
  "external_validation_results",
  "cross_validation_results",
  "top_models_report_overall",
  "top_models_report_scientific",
  "top_models_report_seed_average",
  "deployment",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
pretty = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
exclude = "(?x)(Mix_Results|Single_Results|reports|figures|external_validation_results|cross_validation_results|top_models_report_overall|top_models_report_scientific|top_models_report_seed_average|deployment)/"
